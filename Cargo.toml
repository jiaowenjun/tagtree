[workspace]
resolver = "2"

[package]
name = "tagtree"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
authors = ["Weimo <weimo@weimo.cc>"]
description = "An in-memory tree for hierarchical tag paths and item assignments."
